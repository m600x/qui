name: Fork image

# Builds the current branch and pushes ghcr.io/<owner>/qui:<branch> and :latest.
# It skips the tests and GoReleaser, so a fork gets an image without the
# release secrets. Run it from the Actions tab or push to develop.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma separated list of platforms to build"
        required: false
        default: "linux/amd64"
        type: string
  push:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  NODE_VERSION: "24.15.0"

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and push image
    if: github.repository != 'autobrr/qui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Fetch community themes
        uses: actions/checkout@v7.0.1
        with:
          repository: autobrr/qui-community-themes
          ref: main
          path: .themes-temp
          sparse-checkout: themes
          persist-credentials: false

      # Files that start with "_" (the template) are not themes.
      - name: Copy community themes
        run: cp .themes-temp/themes/[!_]*.css .themes-temp/LICENSE internal/themes/assets/premium/

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        working-directory: web
        run: CI= pnpm run build

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Write the notices file
        run: go run ./scripts/notices

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and publish image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./distrib/docker/ci.Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            BUILDER=${{ github.actor }}@github-actions
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
